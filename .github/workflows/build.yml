name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"

      - name: Set version
        run: |
          # Base version comes from the project file (1.0); the run number bumps it on every build
          BASE="$(grep -m1 'MARKETING_VERSION' NiceStats.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')"
          echo "VERSION=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "DMG=NiceStats-$BASE.$GITHUB_RUN_NUMBER-arm64.dmg" >> "$GITHUB_ENV"

      - name: Build (arm64, Release)
        run: |
          xcodebuild build \
            -project NiceStats.xcodeproj \
            -scheme NiceStats \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: scripts/make-dmg.sh build/Build/Products/Release/NiceStats.app "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$DMG" \
            --latest \
            --target "$GITHUB_SHA" \
            --title "NiceStats $VERSION" \
            --notes "Built from $GITHUB_SHA"
